<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT-BEAUTY 2026 : VISUAL IP STRATEGY</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f8f8f8; --accent: #d4af37; --bg: #000000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); color: var(--primary); line-height: 1.8; }
        .hero { height: 50vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=2000'); background-size: cover; background-position: center; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-style: italic; color: #fff; }
        .hero p { color: var(--accent); letter-spacing: 5px; font-weight: 700; margin-top: 10px; }
        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
        .section { margin-bottom: 60px; border-left: 3px solid var(--accent); padding-left: 20px; }
        .section h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 15px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #111; padding: 25px; border: 1px solid #222; }
        .card h3 { color: var(--accent); margin-bottom: 10px; }
        /* 진단 기능 디자인 */
        .lab { background: #0a0a0a; padding: 40px; text-align: center; border: 1px solid var(--accent); border-radius: 10px; margin-top: 40px; }
        .btn-skill { background: var(--accent); color: #000; border: none; padding: 15px 40px; font-weight: 800; cursor: pointer; border-radius: 30px; font-size: 1.1rem; margin-top: 20px; }
        #result-area { margin-top: 25px; font-size: 1.3rem; font-weight: 700; color: #fff; min-height: 40px; }
        footer { text-align: center; padding: 40px; color: #555; font-size: 0.8rem; border-top: 1px solid #111; }
    </style>
</head>
<body>
    <div class="hero">
        <div><p>K-ENT STRATEGY</p><h1>Visual IP Era</h1></div>
    </div>
    <div class="container">
        <div class="section">
            <h2>01. Insight</h2>
            <p>음악은 이제 '바르는' 것입니다. 비주얼 디렉팅은 엔터 산업의 핵심 자산(Visual IP)입니다.</p>
        </div>
        <div class="section">
            <h2>02. HMC Framework</h2>
            <div class="card-grid">
                <div class="card"><h3>Hair</h3><p>컨셉 컬러와 텍스처로 페르소나 설계</p></div>
                <div class="card"><h3>Makeup</h3><p>브랜드 아이덴티티를 담은 비주얼 구축</p></div>
            </div>
        </div>
        <div class="lab">
            <h2 style="color:var(--accent); border:none; font-family:serif;">CHROMAVERSE LAB</h2>
            <p>나에게 가장 잘 어울리는 2026 K-뷰티 컨셉은?</p>
            <button class="btn-skill" onclick="startDiagnosis()">진단 결과 확인</button>
            <div id="result-area"></div>
        </div>
    </div>
    <footer>
        <p>Created by Kim Ju-yeon | Student ID: 20241516</p>
    </footer>
    <script>
        function startDiagnosis() {
            const res = [
                "💎 [SILENT LUXURY] : 하이엔드 뷰티룩",
                "✨ [GLITCH CHIC] : 가상 세계 포인트 메이크업",
                "🌸 [K-GARDEN] : 소프트 레이어링 스타일",
                "🔥 [CYBER PUNK] : 카리스마 스모키"
            ];
            const random = res[Math.floor(Math.random() * res.length)];
            document.getElementById('result-area').innerText = random;
        }
    </script>
</body>
</html>
